name: Build Environment Monitor ESP32

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [iot-hub, http-api, mqtt, mqtt-tls]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Prepare device configuration
        working-directory: src/configs
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: |
          cp pins_CP2102.h pins.h
          cp iot_configs.example.h iot_configs.h
          case "$BUILD_VARIANT" in
            http-api)
              sed -i 's|^#define USE_IOT_HUB$|//#define USE_IOT_HUB|; s|^//#define USE_HTTP_API$|#define USE_HTTP_API|' iot_configs.h
              ;;
            mqtt|mqtt-tls)
              sed -i 's|^//#define USE_MQQT_BROKER$|#define USE_MQQT_BROKER|' iot_configs.h
              if [ "$BUILD_VARIANT" = mqtt ]; then
                sed -i 's/^#define MQTT_BROKER_USE_TLS 1$/#define MQTT_BROKER_USE_TLS 0/' iot_configs.h
              fi
              ;;
          esac
      - name: Build firmware
        run: pio run -e esp32dev
